<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Sandbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #tabs {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #eeeeee;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 15px;
            border: none;
            background: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tab.active {
            background: #3977b8;
            color: white;
        }

        #content {
            flex: 1;
            min-height: 0;
        }

        #preview {
            width: 100%;
            height: 100%;
            border: none;
        }

        #source {
            display: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 15px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #1e1e1e;
            color: #eeeeee;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <div id="tabs"></div>

    <div id="content">
        <iframe id="preview" sandbox="allow-scripts allow-forms"></iframe>
        <pre id="source"></pre>
    </div>

    <script>
        const tabs = document.getElementById("tabs");
        const preview = document.getElementById("preview");
        const source = document.getElementById("source");

        let files = [];

        async function loadFiles() {
            try {
                // get file list from PHP 
                const response = await fetch("list_files.php");

                if (!response.ok) {
                    throw new Error("Could not load file list");
                }

                files = await response.json();

                tabs.innerHTML = "";

                files.forEach(function(file, index) {
                    const button = document.createElement("button");

                    button.className = "tab";
                    button.textContent = file.name;

                    button.addEventListener("click", function() {
                        showFile(index);
                    });

                    tabs.appendChild(button);
                });

                if (files.length > 0) {
                    showFile(0);
                } else {
                    source.style.display = "block";
                    preview.style.display = "none";
                    source.textContent = "No files found.";
                }

            } catch (error) {
                preview.style.display = "none";
                source.style.display = "block";
                source.textContent = "Error loading files: " + error.message;
            }
        }

        async function showFile(index) {
            const file = files[index];

            document.querySelectorAll(".tab").forEach(function(tab, i) {
                tab.classList.toggle("active", i === index);
            });

            const extension = file.name.split(".").pop().toLowerCase();

            if (extension === "html" || extension === "htm") {
                // load HTML file as a webpage
                source.style.display = "none";
                preview.style.display = "block";

                preview.src = file.url;
            } else {
                // load non HTML files as source code
                preview.style.display = "none";
                source.style.display = "block";
                source.textContent = "Loading...";

                try {
                    const response = await fetch(file.url);

                    if (!response.ok) {
                        throw new Error("Could not load file");
                    }

                    source.textContent = await response.text();

                } catch (error) {
                    source.textContent = "Error loading file: " + error.message;
                }
            }
        }

        loadFiles();
    </script>

</body>
</html>
